<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="start-folder/css/style.css" />
  </head>
  <header>
    <h1>私のポートフォリオ</h1>
    <nav>
      <ul class="nav">
        <li><a href="index.html">ホーム</a></li>
        <li><a href="contact.html">お問合せ</a></li>
      </ul>
    </nav>
  </header>
  <body>
    <main>
      <div class="fotm">
        <h2>お問合せフォーム</h2>
        <form action="#" method="POST">
          <label for="name">名前</label>
          <input type="text" id="name" required /><br />
          <label for="mail">メールアドレス</label>
          <input type="mail" id="mail" required /><br />
          <label for="purpose">目的</label>
          <select name="choice" id="choice">
            <option value="not-choice">未選択</option>
            <option value="recrutment">リクルート</option>
            <option value="question">質問</option>
            <option value="job-request">仕事依頼</option></select
          ><br />
          <label for="massage">メッセージ</label>
          <textarea id="message" rows="5" required></textarea>
          <button type="submit">送信</button>
        </form>
      </div>
      <footer class="contact">&copy;2026私のポートフォリオ</footer>
    </main>
  </body>
</html>
